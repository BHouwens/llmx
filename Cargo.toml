[package]
name = "llmx"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Launcher that resolves a model profile to a healthy OpenAI-compatible endpoint and hands it to codex-local"
license = "Apache-2.0"

[[bin]]
name = "llmx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
image = { version = "=0.25.1", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
ratatui = "0.29"
ratatui-image = { version = "4.2", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "signal", "fs", "io-util", "net"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
